project_id = "empire-command-center"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://command.sealesempire.xyz"]
jwt_expiry = 3600
enable_signup = true

[edge_runtime]
enabled = true
policy = "oneshot"

[functions.ingest]
verify_jwt = true

[functions.extract-tasks]
verify_jwt = true

[functions.daily-report]
verify_jwt = true

[functions.summarize]
verify_jwt = true

[functions.classify]
verify_jwt = true

[functions.dedupe]
verify_jwt = true
