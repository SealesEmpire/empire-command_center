name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web (typecheck · lint · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  worker:
    name: wan22-runpod-worker (smoke tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wan22-runpod-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # test_local.py stubs `runpod`; it only needs the storage layer's deps.
      - run: pip install boto3 botocore
      - run: python test_local.py
