name: Web CI

# Typecheck + production build of the Next.js orchestrator/dashboard so broken
# code is caught before it reaches main. No secrets needed — env vars are read
# lazily at request time, not during the build.

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"
  pull_request:
    paths:
      - "web/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
