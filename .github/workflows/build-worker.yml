name: Build WAN worker

# Builds the RunPod worker image and pushes it to GitHub Container Registry
# (ghcr.io). The package inherits the repo's visibility — since this repo is
# private, the image is private too. No registry secrets needed: the built-in
# GITHUB_TOKEN authenticates the push.

on:
  push:
    branches: [main]
    paths:
      - "wan22-runpod-worker/**"
      - ".github/workflows/build-worker.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag (e.g. v1). Leave blank for SHA only."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/wan22-runpod-worker

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: img
        run: echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.image }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: wan22-runpod-worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
