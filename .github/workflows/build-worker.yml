name: Build workers

# Builds each RunPod worker ("bot") image and pushes it to GitHub Container
# Registry (ghcr.io), private (inherits repo visibility). No registry secrets —
# the built-in GITHUB_TOKEN authenticates the push.
#
# Add a new bot by appending one entry to the matrix below and adding its dir to
# the paths filter.

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "wan22-runpod-worker/**"
      - "image-runpod-worker/**"
      - "audio-runpod-worker/**"
      - ".github/workflows/build-worker.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag (e.g. v1). Leave blank for SHA only."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker:
          - { dir: wan22-runpod-worker, name: wan22-runpod-worker }
          - { dir: image-runpod-worker, name: image-runpod-worker }
          - { dir: audio-runpod-worker, name: audio-runpod-worker }
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Resolve image name
        id: img
        run: |
          owner="${{ github.repository_owner }}"
          echo "image=ghcr.io/${owner,,}/${{ matrix.worker.name }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.worker.dir }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.worker.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.worker.name }}

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.worker.name }} pushed"
            echo ""
            echo "Private image on \`ghcr.io\`. Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Paste one tag into the worker's RunPod endpoint **Container Image** field."
            echo "> Private pull: add a GHCR credential in RunPod (user = GitHub username, password = PAT with \`read:packages\`)."
          } >> "$GITHUB_STEP_SUMMARY"
